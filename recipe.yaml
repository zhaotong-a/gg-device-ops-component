---
RecipeFormatVersion: '2020-01-25'
ComponentName: com.example.DeviceOps
ComponentVersion: '1.0.0'
ComponentDescription: 'Device Operations Component - IoT Jobs executor for remote device management'
ComponentPublisher: 'AWS'
ComponentType: aws.greengrass.generic

ComponentConfiguration:
  DefaultConfiguration:
    logging:
      level: "info"
    security:
      allowlist: []
    execution:
      defaultTimeout: 300
    accessControl:
      aws.greengrass.ipc.mqttproxy:
        "com.example.DeviceOps:mqttproxy:1":
          policyDescription: "Allows publish/subscribe to IoT Core MQTT topics for job handling"
          operations:
            - "aws.greengrass#PublishToIoTCore"
            - "aws.greengrass#SubscribeToIoTCore"
          resources:
            - "$aws/things/{iot:thingName}/jobs/notify-next"
            - "$aws/things/{iot:thingName}/jobs/$next/get"
            - "$aws/things/{iot:thingName}/jobs/$next/get/accepted"
            - "$aws/things/{iot:thingName}/jobs/*/update"
            - "$aws/things/{iot:thingName}/jobs/+/update/accepted"
            - "$aws/things/{iot:thingName}/jobs/+/update/rejected"

Manifests:
  - Platform:
      os: linux
      architecture: aarch64
      runtime: "*"
    Name: Linux-aarch64
    Lifecycle:
      run: |
        export RUST_LOG=device_ops_component={configuration:/logging/level}
        {artifacts:decompressedPath}/device-ops-1.0.0-aarch64/bin/device-ops-component
    Artifacts:
      - URI: s3://YOUR-BUCKET/device-ops/1.0.0/device-ops-1.0.0-aarch64.zip
        Unarchive: ZIP
  - Platform:
      os: linux
      architecture: amd64
      runtime: "*"
    Name: Linux-x86_64
    Lifecycle:
      run: |
        export RUST_LOG=device_ops_component={configuration:/logging/level}
        {artifacts:decompressedPath}/device-ops-1.0.0-x86_64/bin/device-ops-component
    Artifacts:
      - URI: s3://YOUR-BUCKET/device-ops/1.0.0/device-ops-1.0.0-x86_64.zip
        Unarchive: ZIP
